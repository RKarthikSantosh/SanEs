name: RAG evaluation

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q

  retrieval-regression:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DATASETS_DIR: ${{ github.workspace }}/datasets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download BEIR SciFact
        run: |
          mkdir -p "$DATASETS_DIR" && cd "$DATASETS_DIR"
          curl -sSfLO https://public.ukp.informatik.tu-darmstadt.de/thakur/BEIR/datasets/scifact.zip
          unzip -q scifact.zip
      - name: Hybrid retrieval must not regress
        run: python -m experiments.regression_check

  answer-quality:
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_FALLBACK: ${{ secrets.GROQ_API_KEY_FALLBACK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        if: env.GROQ_API_KEY != ''
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: RAGAS faithfulness gate
        if: env.GROQ_API_KEY != ''
        run: python -m experiments.ragas_regression
      - name: Skip notice
        if: env.GROQ_API_KEY == ''
        run: echo "GROQ_API_KEY secret not set; answer-quality gate skipped."
